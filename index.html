<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitoria Wendt</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #333;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #ccc;
      font-weight: 500;
    }

    nav a:hover {
      color: #fff;
    }

    .container {
      display: flex;
      padding: 40px;
      gap: 40px;
    }

    .sidebar {
      width: 250px;
    }

    .profile-pic {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #444;
    }

    .name {
      font-size: 22px;
      margin-top: 20px;
      font-weight: bold;
    }

    .role {
      color: #aaa;
      margin-bottom: 20px;
    }

    .info {
      font-size: 14px;
      line-height: 1.8;
      color: #ccc;
    }

    .main {
      flex: 1;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    p {
      color: #ccc;
      line-height: 1.6;
      max-width: 800px;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
      }

      .sidebar {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <div><strong>Vitoria Wendt</strong></div>
    <nav>
      <a href="#">About</a>
      <a href="#">Research</a>
      <a href="#">CV</a>
      <a href="#">Teaching</a>
      <a href="#">Code</a>
    </nav>
  </header>

  <div class="container">
    <div class="sidebar">
      <img src="ima2.PNG" alt="Foto" class="profile-pic">

      <div class="name">Vitoria Wendt</div>
      <div class="role">Sua Profissão</div>

      <div class="info">
        📍 Sua Cidade<br>
        🏫 Sua Universidade<br>
        ✉️ Email<br>
        🐦 Twitter<br>
        💻 GitHub<br>
        🎓 Google Scholar
      </div>
    </div>

    <div class="main">
      <h1>About me</h1>
      <p>
        Escreva aqui sua descrição profissional. Você pode falar sobre sua área de pesquisa,
        formação acadêmica e interesses.
      </p>
    </div>
  </div>

</body>
</html>
